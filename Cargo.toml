[package]
name = "gwz-py"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.95"
repository = "https://github.com/owebeeone/gwz-py"

[lib]
name = "_gwz_core"
path = "native/src/lib.rs"
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gwz_transport_candidate)', 'cfg(gwz_session_candidate)'] }

[dependencies]
gwz-sspi = { path = "../gwz-sspi", version = "=0.1.0" }
cfg-if = "1"
gwz-core = { path = "../gwz-core" }
# No `extension-module` here, so that `cargo test` links libpython: maturin
# enables it for the extension, from pyproject.toml's [tool.maturin] features.
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[workspace]
