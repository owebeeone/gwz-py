name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  validate:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout gwz-py
        uses: actions/checkout@v5
        with:
          path: gwz-py

      - name: Checkout gwz-core
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-core
          path: gwz-core

      - name: Check out git2-rs beside gwz-core
        # gwz-core builds against the git2-rs fork by path (`../git2-rs`, package
        # `gwz-git2`), at the commit gwz-core's .github/git2-rs.commit pins.
        shell: bash
        working-directory: gwz-core
        run: bash .github/checkout-git2-rs.sh

      - name: Checkout gwz-cli
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-cli
          path: gwz-cli

      - name: Checkout gwz-sspi
        # gwz-py and gwz-cli build against gwz-sspi by path (`../gwz-sspi`).
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-sspi
          path: gwz-sspi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create Python virtual environment
        shell: python
        run: |
          import os
          import pathlib
          import venv

          root = pathlib.Path(".venv").resolve()
          venv.EnvBuilder(with_pip=True).create(root)
          scripts = root / ("Scripts" if os.name == "nt" else "bin")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"VIRTUAL_ENV={root}", file=env_file)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              print(scripts, file=path_file)

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Windows native build prerequisites
        if: runner.os == 'Windows'
        # bash, not the default PowerShell, which fails a step only on its last
        # command's exit status.
        shell: bash
        run: |
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            VCPKG_INSTALLATION_ROOT='C:\vcpkg'
          fi
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=0" >> "$GITHUB_ENV"
          vcpkg install openssl:x64-windows-static

      - name: Install Python dependencies
        working-directory: gwz-py
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check protocol drift
        working-directory: gwz-py
        run: python scripts/check_protocol_drift.py

      - name: Check generated protocol
        working-directory: gwz-py
        run: python scripts/regen_protocol.py --check

      - name: Check native extension crate
        working-directory: gwz-py
        run: cargo check

      - name: Resolve gwz-cli's lock against the checkouts beside it
        # In a workspace gwz-cli builds in the workspace's lock. Its own
        # Cargo.lock is refreshed at its releases, so it can lag gwz-core's main,
        # and run_tests.py builds the CLI with --locked. Resolving it here first,
        # in CI only, as gwz-core's candidate job resolves its candidate
        # manifest, lets that build use the lock as resolved.
        shell: bash
        working-directory: gwz-cli
        run: cargo metadata --format-version 1 > /dev/null

      - name: Run Python tests
        working-directory: gwz-py
        run: python run_tests.py

  rust-tests:
    # The extension's Rust unit tests (native/src), on the ordinary build.
    # Cargo.toml leaves PyO3's extension-module feature to maturin, so the
    # test binary links the libpython of the interpreter setup-python
    # installs, which that action puts on LD_LIBRARY_PATH. The candidate
    # build's unit tests run in transport-candidate.yml.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout gwz-py
        uses: actions/checkout@v5
        with:
          path: gwz-py

      - name: Checkout gwz-core
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-core
          path: gwz-core

      - name: Check out git2-rs beside gwz-core
        # gwz-core builds against the git2-rs fork by path (`../git2-rs`, package
        # `gwz-git2`), at the commit gwz-core's .github/git2-rs.commit pins.
        shell: bash
        working-directory: gwz-core
        run: bash .github/checkout-git2-rs.sh

      - name: Checkout gwz-sspi
        # gwz-py builds against gwz-sspi by path (`../gwz-sspi`).
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-sspi
          path: gwz-sspi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Run Rust unit tests
        working-directory: gwz-py
        run: cargo test

  package-smoke:
    runs-on: ${{ matrix.os }}
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]

    steps:
      - name: Checkout gwz-py
        uses: actions/checkout@v5
        with:
          path: gwz-py

      - name: Checkout gwz-core
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-core
          path: gwz-core

      - name: Check out git2-rs beside gwz-core
        # gwz-core builds against the git2-rs fork by path (`../git2-rs`, package
        # `gwz-git2`), at the commit gwz-core's .github/git2-rs.commit pins.
        shell: bash
        working-directory: gwz-core
        run: bash .github/checkout-git2-rs.sh

      - name: Checkout gwz-sspi
        # gwz-py builds against gwz-sspi by path (`../gwz-sspi`).
        uses: actions/checkout@v5
        with:
          repository: owebeeone/gwz-sspi
          path: gwz-sspi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build prerequisites
        if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config

      - name: Install Windows native build prerequisites
        if: runner.os == 'Windows'
        # bash, not the default PowerShell, which fails a step only on its last
        # command's exit status.
        shell: bash
        run: |
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            VCPKG_INSTALLATION_ROOT='C:\vcpkg'
          fi
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=0" >> "$GITHUB_ENV"
          vcpkg install openssl:x64-windows-static

      - name: Install Python build tools
        # bash fails the step on the first failing command on Windows too.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin "taut-proto==0.10.0"

      - name: Run package smoke
        working-directory: gwz-py
        run: python scripts/package_smoke.py
